{% extends "base.html" %}
{% block title %}Quên Mật Khẩu{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2 class="auth-title"><i class="fa-solid fa-envelope"></i> Khôi Phục Mật Khẩu</h2>
    <p style="font-family:var(--mono);font-size:.78rem;color:var(--text-dim);text-align:center;margin-bottom:1.5rem;">
      Nhập email đăng ký. Chúng tôi sẽ gửi link đặt lại mật khẩu.
    </p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <label>Email</label>
      <div class="input-group">
        <i class="fa-solid fa-envelope prefix"></i>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <button type="submit" style="width:100%;margin-top:1rem;">
        <i class="fa-solid fa-paper-plane"></i> Gửi Link Khôi Phục
      </button>
    </form>
    <hr class="sep">
    <p style="text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--text-dim);">
      <a href="{{ url_for('login') }}" style="color:var(--c);text-decoration:none;">← Quay lại đăng nhập</a>
    </p>
  </div>
</div>
{% endblock %}
