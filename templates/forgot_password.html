{% extends "base.html" %}
{% block title %}Quên Mật Khẩu{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="width: 400px; padding: 40px; background: rgba(0,0,0,0.8); border: 1px solid #ff4444; border-radius: 15px;">
        <h2 style="text-align: center; color: #ff4444; margin-bottom: 20px;">KHÔI PHỤC TÀI KHOẢN</h2>
        <p style="color: #ccc; text-align: center; margin-bottom: 20px;">Nhập email đăng ký để nhận link đặt lại mật khẩu.</p>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div style="position: relative; margin-bottom: 20px;">
                <i class="fa-solid fa-envelope" style="position: absolute; left: 15px; top: 12px; color: #ff4444;"></i>
                <input type="email" name="email" placeholder="Email của bạn..." required 
                       style="width: 100%; padding: 10px 10px 10px 40px; background: #222; border: 1px solid #555; color: white; border-radius: 5px; outline: none;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background: #ff4444; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">GỬI YÊU CẦU</button>
        </form>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('login') }}" style="color: #888; text-decoration: none;">Quay lại đăng nhập</a>
        </div>
    </div>
</div>
{% endblock %}
