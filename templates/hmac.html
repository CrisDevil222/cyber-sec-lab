{% extends "base.html" %}
{% block title %}HMAC Tool{% endblock %}
{% block content %}
<div class="tool-box">
  <h2><i class="fa-solid fa-key"></i> HMAC-SHA256 Generator</h2>
  <p>Tạo chữ ký số HMAC-SHA256 để xác minh tính toàn vẹn và xác thực nguồn gốc dữ liệu.</p>

  <form method="POST" style="margin-top:1.5rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <label>Secret Key</label>
    <input type="text" name="key" placeholder="Nhập khóa bí mật..." required>
    <label>Data / Message</label>
    <textarea name="data" placeholder="Nhập dữ liệu cần ký..." required rows="3"></textarea>
    <button type="submit" style="margin-top:1rem;"><i class="fa-solid fa-signature"></i> Generate HMAC</button>
  </form>

  {% if result %}
  <div class="result-box">
    <h3>HMAC-SHA256 Signature</h3>
    <code style="display:block;padding:1rem;word-break:break-all;font-size:.82rem;background:rgba(0,0,0,.4);border-radius:var(--radius);margin-top:.5rem;color:var(--c3);">{{ result }}</code>
  </div>
  {% endif %}
</div>
{% endblock %}
