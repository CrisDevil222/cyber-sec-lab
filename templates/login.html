{% extends "base.html" %}

{% block title %}Đăng nhập hệ thống{% endblock %}

{% block content %}
<div class="auth-form-container">
    <div class="auth-header">
        <i class="fa-solid fa-user-lock"></i> Đăng nhập
    </div>
    
    <form method="POST">
        <div style="text-align: left; margin-bottom: 5px; color: var(--text-secondary);">
            <i class="fa-solid fa-user"></i> Username
        </div>
        <input type="text" name="username" placeholder="Nhập tên đăng nhập..." required autocomplete="off">
        
        <div style="text-align: left; margin-bottom: 5px; margin-top: 15px; color: var(--text-secondary);">
            <i class="fa-solid fa-key"></i> Password
        </div>
        <input type="password" name="password" placeholder="Nhập mật khẩu..." required>
        
        <button type="submit" style="margin-top: 25px;">
            <i class="fa-solid fa-right-to-bracket"></i> Truy cập
        </button>
    </form>

    <p style="margin-top: 20px; color: var(--text-secondary); font-size: 0.9rem;">
        Chưa có tài khoản? 
        <a href="{{ url_for('register') }}" class="auth-link">Đăng ký ngay</a>
    </p>
</div>
{% endblock %}
