{% extends "base.html" %}
{% block title %}Đăng Nhập — Cyber Security Lab{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2 class="auth-title"><i class="fa-solid fa-terminal"></i> Secure Login</h2>

    <form method="POST" style="display:flex;flex-direction:column;gap:.2rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <label>Tài khoản</label>
      <div class="input-group">
        <i class="fa-solid fa-user prefix"></i>
        <input type="text" name="username" placeholder="Username..." required autocomplete="username">
      </div>

      <label>Mật khẩu</label>
      <div class="input-group has-suffix">
        <i class="fa-solid fa-lock prefix"></i>
        <input type="password" name="password" id="passInput" placeholder="Password..." required autocomplete="current-password">
        <i class="fa-solid fa-eye suffix" id="eyeIcon" onclick="togglePass()"></i>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:1rem 0;">
        <label style="display:flex;align-items:center;gap:.5rem;text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--text);margin:0;cursor:pointer;">
          <input type="checkbox" name="remember"> Ghi nhớ đăng nhập
        </label>
        <a href="{{ url_for('forgot_password') }}" style="font-family:var(--mono);font-size:.72rem;color:var(--c2);text-decoration:none;transition:opacity .2s;" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">Quên mật khẩu?</a>
      </div>

      <button type="submit" style="width:100%;margin-top:.5rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
      </button>
    </form>

    <hr class="sep">
    <p style="text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--text-dim);">
      Chưa có tài khoản?
      <a href="{{ url_for('register') }}" style="color:var(--c);text-decoration:none;font-weight:500;">Đăng ký ngay →</a>
    </p>
  </div>
</div>
<script>
function togglePass() {
  const x = document.getElementById("passInput"), i = document.getElementById("eyeIcon");
  const show = x.type === "password";
  x.type = show ? "text" : "password";
  i.className = show ? "fa-solid fa-eye-slash suffix" : "fa-solid fa-eye suffix";
  i.style.color = show ? "var(--c)" : "";
}
</script>
{% endblock %}
