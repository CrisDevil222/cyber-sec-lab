{% extends "base.html" %}
{% block title %}Đăng Ký — Cyber Security Lab{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="max-width:460px;">
    <h2 class="auth-title"><i class="fa-solid fa-user-plus"></i> Tạo Tài Khoản</h2>

    <form method="POST" style="display:flex;flex-direction:column;gap:.2rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <label>Email xác thực</label>
      <div class="input-group">
        <i class="fa-solid fa-envelope prefix"></i>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>

      <label>Tên đăng nhập</label>
      <div class="input-group">
        <i class="fa-solid fa-user prefix"></i>
        <input type="text" name="username" placeholder="Chọn username..." required>
      </div>

      <label>Mật khẩu</label>
      <div class="input-group has-suffix">
        <i class="fa-solid fa-lock prefix"></i>
        <input type="password" name="password" id="regPass" placeholder="Tối thiểu 8 ký tự..." required>
        <i class="fa-solid fa-eye suffix" id="regEye" onclick="toggleReg()"></i>
      </div>

      <button type="submit" style="width:100%;margin-top:1.2rem;">
        <i class="fa-solid fa-check-circle"></i> Tạo Tài Khoản
      </button>
    </form>

    <hr class="sep">
    <p style="text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--text-dim);">
      Đã có tài khoản?
      <a href="{{ url_for('login') }}" style="color:var(--c);text-decoration:none;font-weight:500;">Đăng nhập →</a>
    </p>
  </div>
</div>
<script>
function toggleReg() {
  const x = document.getElementById("regPass"), i = document.getElementById("regEye");
  const show = x.type === "password";
  x.type = show ? "text" : "password";
  i.className = show ? "fa-solid fa-eye-slash suffix" : "fa-solid fa-eye suffix";
}
</script>
{% endblock %}
