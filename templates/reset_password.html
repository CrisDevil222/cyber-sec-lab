{% extends "base.html" %}
{% block title %}Đặt Mật Khẩu Mới{% endblock %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="width: 400px; padding: 40px; background: rgba(0,0,0,0.8); border: 1px solid #00C851; border-radius: 15px;">
        <h2 style="text-align: center; color: #00C851; margin-bottom: 20px;">MẬT KHẨU MỚI</h2>
        
        <form method="POST">
            <input type="password" name="password" placeholder="Nhập mật khẩu mới..." required 
                   style="width: 100%; padding: 12px; margin-bottom: 20px; background: #222; border: 1px solid #555; color: white; border-radius: 5px; outline: none;">
            <button type="submit" style="width: 100%; padding: 12px; background: #00C851; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">XÁC NHẬN ĐỔI</button>
        </form>
    </div>
</div>
{% endblock %}
