{% extends "base.html" %}
{% block title %}Đặt Lại Mật Khẩu{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2 class="auth-title"><i class="fa-solid fa-lock-open"></i> Đặt Lại Mật Khẩu</h2>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <label>Mật khẩu mới</label>
      <div class="input-group has-suffix">
        <i class="fa-solid fa-lock prefix"></i>
        <input type="password" name="password" id="newPass" placeholder="Tối thiểu 8 ký tự..." required>
        <i class="fa-solid fa-eye suffix" id="newEye" onclick="toggleNew()"></i>
      </div>
      <button type="submit" style="width:100%;margin-top:1rem;">
        <i class="fa-solid fa-check"></i> Cập Nhật Mật Khẩu
      </button>
    </form>
  </div>
</div>
<script>
function toggleNew() {
  const x = document.getElementById("newPass"), i = document.getElementById("newEye");
  const show = x.type === "password";
  x.type = show ? "text" : "password";
  i.className = show ? "fa-solid fa-eye-slash suffix" : "fa-solid fa-eye suffix";
}
</script>
{% endblock %}
